<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | DAILYWINS</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="auth-shell"><main class="auth-card"><div class="brand center"><img src="{{ url_for('static',filename='images/logo.png') }}" alt="DAILYWINS"><span>DAILYWINS</span></div><span class="badge badge-red">ADMIN PORTAL</span><h1>Secure administrator sign in</h1><p class="muted">Use the administrator credentials configured on the server.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash flash-{{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form action="{{ url_for('admin_login') }}" method="POST"><label class="label">Email</label><input class="field" type="email" name="email" required autocomplete="username"><label class="label">Password</label><input class="field" type="password" name="password" required autocomplete="current-password"><button class="btn btn-red" style="width:100%;margin-top:16px">Sign in</button></form><a class="text-link" href="{{ url_for('login') }}">Back to user login</a></main></body></html>
