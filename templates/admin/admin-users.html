<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Users Directory | DailyWins Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <h1 class="text-xl font-bold text-white">Registered Users Directory</h1>
            <a href="{{ url_for('admin_logout') }}" class="bg-rose-600/20 text-rose-400 px-4 py-2 rounded-xl text-xs font-bold">Logout</a>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-950 text-slate-400 uppercase">
                    <tr>
                        <th class="p-4">Name</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Available Balance</th>
                        <th class="p-4">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    {% for u in users %}
                    <tr class="hover:bg-slate-800/50">
                        <td class="p-4 font-semibold text-white">{{ u.first_name }} {{ u.last_name }}</td>
                        <td class="p-4 text-slate-300">{{ u.email }}</td>
                        <td class="p-4 text-emerald-400 font-bold">${{ u.available_balance }}</td>
                        <td class="p-4">
                            <a href="{{ url_for('admin_user_details', user_id=u.id) }}" class="bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-lg font-bold">View Profile</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="p-4 text-center text-slate-500">No users found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
