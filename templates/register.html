<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — DAILYWINS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
    <div class="min-h-screen grid lg:grid-cols-2">
        <section class="hidden lg:flex relative overflow-hidden p-12 items-end"
            style="background-image:linear-gradient(135deg,rgba(2,6,23,.92),rgba(2,6,23,.55)),url('{{ url_for('static', filename='images/DW4.png') }}');background-size:cover;background-position:center;">
            <div class="relative z-10 max-w-xl">
                <div class="bg-white rounded-2xl inline-flex p-3 mb-8">
                    <img src="https://infosilverfoxsquad001-rgb.github.io/dailywinstrd.com/static/images/logo.png" alt="DAILYWINS" class="h-12 w-auto">
                </div>
                <p class="text-emerald-300 text-sm font-bold uppercase tracking-widest">Start building your future</p>
                <h1 class="mt-4 text-5xl font-extrabold leading-tight text-white">A smarter way to manage your investment journey.</h1>
            </div>
        </section>

        <section class="flex items-center justify-center p-6 md:p-10">
            <div class="w-full max-w-xl">
                <div class="flex items-center gap-3 mb-8 lg:hidden">
                    <div class="bg-white rounded-xl px-3 py-2">
                        <img src="https://infosilverfoxsquad001-rgb.github.io/dailywinstrd.com/static/images/logo.png" alt="DAILYWINS" class="h-9 w-auto">
                    </div>
                    <span class="text-xl font-bold">DAILYWINS</span>
                </div>

                <div class="mb-8">
                    <h2 class="text-3xl font-extrabold text-white">Create your account</h2>
                    <p class="text-sm text-slate-400 mt-2">Enter your details to begin your investment journey.</p>
                </div>

                <form method="POST" action="https://infosilverfoxsquad001-rgb.github.io/dailywinstrd.com/templates/register.html" class="bg-white text-slate-900 rounded-3xl p-6 md:p-8 shadow-2xl space-y-5">
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-700">First Name</label>
                            <input type="text" name="first_name" required class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-700">Last Name</label>
                            <input type="text" name="last_name" required class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-700">Email Address</label>
                        <input type="email" name="email" required autocomplete="email" class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-700">Country</label>
                        <input type="text" name="country" required class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                    </div>
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-700">Password</label>
                            <input type="password" name="password" minlength="8" required autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-700">Confirm Password</label>
                            <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full rounded-xl bg-emerald-600 py-3.5 text-sm font-bold text-white transition hover:bg-emerald-500">
                        Create Account
                    </button>
                    <p class="text-center text-xs text-slate-500">
                        Already have an account?
                        <a href="https://infosilverfoxsquad001-rgb.github.io/dailywinstrd.com/templates/login.html" class="font-bold text-emerald-600 hover:underline">Sign in</a>
                    </p>
                </form>
            </div>
        </section>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
