<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DAILYWINS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-emerald-500 selection:text-slate-950 flex flex-col justify-between">

    <!-- Header / Brand -->
    <header class="w-full bg-slate-950/80 backdrop-blur-md border-b border-slate-900">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 p-2 rounded-xl text-slate-950 font-black text-xl tracking-tighter">DO</div>
                <span class="text-xl font-bold tracking-tight text-white">DAILYWINS</span>
            </div>
            <div class="flex items-center space-x-3 text-xs text-slate-400">
                <span>New to DAILYWINS?</span>
                <a href="{{ url_for('register') }}" class="text-emerald-400 hover:underline font-semibold">Create Account</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-6 py-12 w-full my-auto space-y-8">
        
        <!-- Heading -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Welcome Back</h1>
            <p class="text-xs text-slate-400">Enter your credentials to access your secure trading portal.</p>
        </div>

        <!-- Login Card (Modified with Clean White Background & Dark Contrast Text) -->
        <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-2xl space-y-6 text-slate-900">
            
            <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
                
                <div class="space-y-1.5">
                    <label class="text-xs text-slate-700 font-semibold">Registered Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="email" id="loginEmail" name="email" required autocomplete="email" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-11 pr-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white font-mono transition">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs text-slate-700 font-semibold">Password</label>
                        <a href="{{ url_for('forgot_password') }}" class="text-[11px] text-emerald-600 hover:underline font-medium">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-11 pr-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
                    </div>
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-slate-50 border-slate-300 text-emerald-600 focus:ring-0 cursor-pointer">
                    <label for="rememberMe" class="text-xs text-slate-600 cursor-pointer select-none">Remember this device for 30 days</label>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 cursor-pointer flex items-center justify-center space-x-2">
                        <span>Sign In to Dashboard</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>

            </form>

            <div class="border-t border-slate-200 pt-6 text-center">
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex items-center justify-center space-x-2 text-xs text-slate-600">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
                    <span>256-Bit Encrypted Secure Connection</span>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-slate-500 text-xs text-center">
        &copy; 2026 DAILYWINS. Secure Financial Services.
    </footer>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
