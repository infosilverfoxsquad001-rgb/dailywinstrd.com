<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | DAILYWINS</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><script src="https://unpkg.com/lucide@latest"></script></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(440px,100%);padding:30px"><div style="text-align:center;margin-bottom:24px"><a class="brand" style="justify-content:center" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="DAILYWINS"><span>DAILYWINS</span></a><h1 style="font-size:30px;margin:22px 0 5px">Welcome back</h1><p class="muted">Sign in to your account.</p></div>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST" action="{{ url_for('login') }}"><label class="label">Email</label><input class="field" type="email" name="email" autocomplete="email" required><div style="height:14px"></div><div style="display:flex;justify-content:space-between;align-items:center"><label class="label" style="margin:0">Password</label><a class="muted" style="font-size:12px" href="{{ url_for('forgot_password') }}">Forgot password?</a></div><input class="field" type="password" name="password" autocomplete="current-password" required><label style="display:flex;gap:8px;align-items:center;margin:14px 0;font-size:13px;color:#aaa"><input type="checkbox" name="remember_me"> Remember me</label><button class="btn btn-red" style="width:100%" type="submit">Sign in <i data-lucide="arrow-right" width="16"></i></button></form>
<p class="muted" style="text-align:center;margin-top:20px;font-size:13px">New here? <a style="color:#f87171;font-weight:800" href="{{ url_for('register') }}">Create an account</a></p>
</div></main><script>lucide.createIcons();</script>{% include "_support_chat.html" %}</body></html>
