<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | DAILYWINS</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(440px,100%);padding:30px"><div class="brand"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="DAILYWINS"><span>DAILYWINS</span></div><h1 style="font-size:30px;margin:24px 0 8px">Create a new password</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST" style="margin-top:20px"><label class="label">New password</label><input class="field" id="password" type="password" name="password" minlength="8" required><div style="height:14px"></div><label class="label">Confirm new password</label><input class="field" id="confirm" type="password" name="confirm_password" minlength="8" required><p id="msg" class="muted" style="font-size:12px"></p><button class="btn btn-red" style="width:100%;margin-top:10px">Update password</button></form></div></main><script>const p=document.getElementById('password'),c=document.getElementById('confirm'),m=document.getElementById('msg');function check(){m.textContent=c.value?(p.value===c.value?'Passwords match.':'Passwords do not match.'):' ';m.style.color=p.value===c.value?'#86efac':'#fca5a5'}p.oninput=check;c.oninput=check;document.querySelector('form').onsubmit=e=>{if(p.value!==c.value)e.preventDefault()};</script>{% include "_support_chat.html" %}</body></html>
