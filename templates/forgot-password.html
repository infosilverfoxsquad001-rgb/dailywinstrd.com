
{% extends "base.html" %}
{% block title %}Forgot Password — DAILYWINS{% endblock %}
{% block content %}
<main class="page auth-page"><div class="card form-card">
<h1>Forgot Password</h1><p class="muted">Enter your registered email address.</p>
<form method="post"><div class="field"><label>Email</label><input type="email" name="email" required></div><button>Send Reset Instructions</button></form>
<p><a class="link" href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
</div></main>
{% endblock %}
