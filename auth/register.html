<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DAILYWINS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased flex flex-col justify-between">

    <header class="w-full py-6 px-6 border-b border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-xl font-bold tracking-tight text-slate-900">DAILYWINS</span>
            <div class="text-sm text-slate-600">
                Already have an account? <a href="login.html" class="text-emerald-600 font-semibold hover:underline ml-1">Sign In</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-lg w-full space-y-8 bg-white border border-slate-200 p-8 rounded-3xl shadow-xl">
            <div class="text-center">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Create Your Account</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-2">Start your journey to secure daily returns</p>
            </div>
                  <div class="p-3 text-xs rounded-xl bg-red-50 text-red-600 border border-red-200">{{ message }}</div>
            <form method="POST" class="mt-8 space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">First Name</label>
                        <input type="text" name="first_name" required placeholder="John" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Last Name</label>
                        <input type="text" name="last_name" required placeholder="Doe" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Country</label>
                    <select name="country" id="countrySelect" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                        <option value="" data-code="">Select your country</option>
                        <option value="NG" data-code="+234">Nigeria</option>
                        <option value="US" data-code="+1">United States</option>
                        <option value="GB" data-code="+44">United Kingdom</option>
                        <option value="AE" data-code="+971">United Arab Emirates</option>
                        <option value="CA" data-code="+1">Canada</option>
                        <option value="ZA" data-code="+27">South Africa</option>
                        <option value="GH" data-code="+233">Ghana</option>
                        <option value="KE" data-code="+254">Kenya</option>
                        <option value="DE" data-code="+49">Germany</option>
                        <option value="FR" data-code="+33">France</option>
                        <option value="AU" data-code="+61">Australia</option>
                        <option value="IN" data-code="+91">India</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Phone Number</label>
                    <div class="flex gap-2">
                        <input type="text" name="country_code" id="countryCode" readonly placeholder="+000" class="w-28 px-4 py-3 bg-slate-100 border border-slate-300 rounded-xl text-sm text-slate-600 cursor-not-allowed">
                        <input type="tel" name="phone" required placeholder="Enter your phone number" class="flex-1 px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Password</label>
                    <input type="password" name="password" id="password" minlength="8" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirmPassword" minlength="8" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    <p id="passwordMatch" class="text-xs mt-2 text-slate-500"></p>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20">
                    Create Account & Send Code
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const form = document.querySelector('form');
        const pw = document.getElementById('password');
        const cpw = document.getElementById('confirmPassword');
        const match = document.getElementById('passwordMatch');
        function checkPasswords(){
            if (!cpw.value) { match.textContent=''; return; }
            match.textContent = pw.value === cpw.value ? 'Passwords match.' : 'Passwords do not match.';
            match.className = 'text-xs mt-2 ' + (pw.value === cpw.value ? 'text-emerald-600' : 'text-red-600');
        }
        pw.addEventListener('input', checkPasswords); cpw.addEventListener('input', checkPasswords);
        form.addEventListener('submit', function(e){ if (pw.value !== cpw.value) { e.preventDefault(); checkPasswords(); cpw.focus(); } });
        const countrySelect = document.getElementById('countrySelect');
        const countryCode = document.getElementById('countryCode');

        countrySelect.addEventListener('change', () => {
            const opt = countrySelect.options[countrySelect.selectedIndex];
            countryCode.value = opt.getAttribute('data-code') || '';
        });
    </script>
</body>
</html>
