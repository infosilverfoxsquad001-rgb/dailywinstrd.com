<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | DAILYWINS</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:20px}
.admin-login{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{margin:0 0 8px;color:#111827}p{color:#64748b}label{display:block;margin:18px 0 7px;font-weight:600;color:#334155}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:700;font-size:15px;cursor:pointer}#error{display:none;margin-top:14px;padding:10px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:14px}
</style>
</head>
<body>
<div class="admin-login">
<h1>DAILYWINS Admin</h1>
<p>Sign in to access the administration portal.</p>
<form id="adminLoginForm">
<label for="username">Username</label>
<input id="username" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign In</button>
<div id="error">Invalid username or password.</div>
</form>
</div>
<script>
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Dailywins@2026";
document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
    sessionStorage.setItem("dailywins_admin_authenticated", "true");
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").style.display = "block";
  }
});
</script>
</body>
</html>
